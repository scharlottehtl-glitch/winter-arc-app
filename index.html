<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#d7a6aa">
<title>Winter Arc</title>
<style>
:root{--bg:#f7f0e9;--card:#fffaf7;--rose:#d7a6aa;--blush:#efd7d8;--beige:#e7d6c6;--brown:#4a3933;--muted:#9a887d;--ok:#dce8d8;--bad:#ead0d0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fbf6f1,#f3e9e2);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--brown)}button,input,select,textarea{font:inherit}.app{max-width:680px;margin:auto;min-height:100vh;padding:18px 14px 90px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:6px 2px 14px}.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}.title{font-family:Georgia,serif;font-size:30px;margin:4px 0}.sub{font-size:12px;color:var(--muted)}.pill{background:var(--blush);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:700}.card{background:var(--card);border:1px solid #eadfd7;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 8px 26px rgba(84,61,51,.08)}.hero{background:linear-gradient(135deg,#f8e5e6,#efe0d3)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.big{font-size:26px;font-weight:800}.small{font-size:12px}.muted{color:var(--muted)}.bar{height:9px;background:#eadfd8;border-radius:99px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:var(--rose)}.screen{display:none}.screen.on{display:block}.habit{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:white;border:1px solid #eee2da;border-radius:17px;padding:12px;margin:8px 0}.habit.good{background:var(--ok)}.habit.part{background:#f0e3d7}.ico{width:42px;height:42px;border-radius:13px;background:var(--blush);display:grid;place-items:center;font-size:20px}.habit b{display:block}.habit span{font-size:12px;color:var(--muted)}.mark{font-weight:900;font-size:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;color:#806d62;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #e6d8cf;background:white;border-radius:13px;padding:11px;color:var(--brown)}.field textarea{min-height:74px}.save{width:100%;border:0;border-radius:15px;background:var(--brown);color:white;padding:13px;font-weight:800}.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.moods button{border:1px solid #e5d8d0;border-radius:13px;background:white;padding:10px 2px;font-size:20px}.moods button.on{background:var(--blush);border-color:var(--rose)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;font-size:10px;color:var(--muted)}.day{aspect-ratio:1;border-radius:11px;background:#ece6e1;display:grid;place-items:center;font-size:11px;font-weight:700}.day.good{background:var(--rose);color:white}.day.part{background:var(--beige)}.day.bad{background:var(--bad)}.day.future{opacity:.32}.day.today{outline:2px solid var(--brown)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:white;border:1px solid #eee2da;border-radius:16px;padding:12px}.stat .n{font-size:23px;font-weight:800}.week{margin:10px 0}.week .bar{margin-top:5px}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,250,247,.96);border-top:1px solid #eaded7;padding:7px 8px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(15px)}nav div{max-width:680px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}nav button{border:0;background:none;padding:5px;color:var(--muted);font-size:10px}nav button.on{color:var(--brown);font-weight:800}nav span{display:block;font-size:20px}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:var(--brown);color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;display:none}@media(max-width:420px){.grid2{grid-template-columns:1fr}.title{font-size:27px}}
</style></head><body><div class="app"><div class="head"><div><div class="ey">dein winter arc</div><div class="title">90 Tage für dich ♡</div><div class="sub">05.10.2026 – 02.01.2027</div></div><div class="pill" id="daypill">Start 05.10.</div></div>
<section id="home" class="screen on"><div class="card hero"><div class="row"><div><div class="small muted">GESAMTFORTSCHRITT</div><div class="big" id="pct">0%</div></div><div style="text-align:right"><div class="small muted">STREAK</div><div class="big" id="streak">0 🔥</div></div></div><div class="bar"><span id="pbar" style="width:0%"></span></div><div class="small muted" id="herotxt" style="margin-top:8px"></div></div><div id="habits"></div><div class="card"><b>Stimmung heute</b><div class="row" style="margin-top:10px"><span class="muted small">Stimmung</span><b id="hmood">–</b></div><div class="row" style="margin-top:8px"><span class="muted small">Energie</span><b id="henergy">–</b></div><div class="row" style="margin-top:8px"><span class="muted small">Stress</span><b id="hstress">–</b></div></div></section>
<section id="check" class="screen"><div class="card"><div class="field"><label>Datum</label><input type="date" id="date"></div></div><div class="card"><div class="grid2"><div class="field"><label>Aufstehzeit</label><input type="time" id="wake"></div><div class="field"><label>Schritte</label><input type="number" id="steps" placeholder="z. B. 7200"></div><div class="field"><label>Lernzeit (h)</label><input type="number" step=".25" id="study" placeholder="z. B. 5.5"></div><div class="field"><label>Bewegung (Min.)</label><input type="number" id="move" placeholder="z. B. 45"></div></div><div class="field"><label>Sport</label><select id="sport"><option value="">Auswählen</option><option>Gym</option><option>Laufen</option><option>Cardio</option><option>Spaziergang</option><option>Gym + Spaziergang</option><option>Laufen + Spaziergang</option><option>Cardio + Spaziergang</option><option>Rest Day + Spaziergang</option></select></div><div class="field"><label>Training / Notiz</label><input id="sportnote" placeholder="z. B. Beine · 55 Min."></div><div class="grid2"><div class="field"><label>Gelesene Seiten</label><input type="number" id="pages" placeholder="0"></div><div class="field"><label>Doomscrolling</label><select id="doom"><option value="">Auswählen</option><option value="gut">Kaum / gar nicht</option><option value="mittel">Etwas</option><option value="viel">Viel</option></select></div></div></div><div class="card"><b>Wie ging es dir?</b><div class="small muted" style="margin:4px 0 10px">1 = niedrig · 5 = hoch</div><div class="field"><label>Stimmung</label><div class="moods" data-f="mood"></div></div><div class="field"><label>Energie</label><div class="moods" data-f="energy"></div></div><div class="field"><label>Stress</label><div class="moods" data-f="stress"></div></div><div class="field"><label>Tagesnotiz</label><textarea id="note" placeholder="Was war heute gut?"></textarea></div><button class="save" id="save">Tag speichern ♡</button></div></section>
<section id="calendar" class="screen"><div class="card"><div class="field"><label>Ansicht</label><select id="metric"><option value="overall">Gesamtübersicht</option><option value="wake">Früh aufstehen</option><option value="steps">Schritte</option><option value="study">Lernen</option><option value="move">Bewegung</option><option value="read">Lesen</option><option value="doom">No Doomscrolling</option><option value="mood">Stimmung</option></select></div><div class="cal" id="cal"></div></div></section>
<section id="stats" class="screen"><div class="stats" id="statcards"></div><div class="card"><b>Diese Woche</b><div id="weekstats"></div><button class="save" id="clean" style="margin-top:12px">Putzen / Aufräumen erledigt</button></div><div class="card"><b>Stimmung & Gewohnheiten</b><div id="moodstats" style="margin-top:10px"></div></div><div class="card"><b>Streaks</b><div id="streakstats" style="margin-top:10px"></div></div></section></div>
<nav><div><button class="on" data-s="home"><span>♡</span>Heute</button><button data-s="check"><span>✎</span>Check-in</button><button data-s="calendar"><span>▦</span>Kalender</button><button data-s="stats"><span>✦</span>Auswertung</button></div></nav><div class="toast" id="toast">Gespeichert ♡</div>
<script>
const START="2026-10-05",END="2027-01-02",KEY="winterArc90_v1";const DATES=[];for(let d=new Date(START+"T12:00:00");d<=new Date(END+"T12:00:00");d.setDate(d.getDate()+1))DATES.push(d.toISOString().slice(0,10));const $=id=>document.getElementById(id),store=()=>JSON.parse(localStorage.getItem(KEY)||'{"days":{},"clean":{}}'),saveStore=s=>localStorage.setItem(KEY,JSON.stringify(s)),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),today=()=>new Date().toISOString().slice(0,10);
function score(d={}){let w=null;if(d.wake){let m=d.wake.split(":").map(Number);m=m[0]*60+m[1];w=m>=390&&m<=450?1:0}let s=d.steps===""||d.steps==null?null:+d.steps>=5000?1:0,st=d.study===""||d.study==null?null:+d.study>=6?1:0,mv=d.move===""||d.move==null?null:+d.move>=30?1:0,r=d.pages===""||d.pages==null?null:+d.pages>0?1:0,dm=!d.doom?null:d.doom==="gut"?1:d.doom==="mittel"?.5:0,a=[w,s,st,mv,r,dm].filter(x=>x!=null),overall=a.length?a.reduce((x,y)=>x+y,0)/6:null;return{wake:w,steps:s,study:st,move:mv,read:r,doom:dm,overall,perfect:a.length===6&&a.every(x=>x===1)}}function arcDay(){return Math.floor((new Date(today()+"T12:00:00")-new Date(START+"T12:00:00"))/86400000)+1}
function streak(metric){let s=store(),best=0,run=0;for(let dt of DATES){let sc=score(s.days[dt]||{}),ok=metric==="overall"?sc.perfect:sc[metric]===1;if(ok){run++;best=Math.max(best,run)}else run=0}let cur=0;for(let i=Math.min(Math.max(DATES.indexOf(today()),0),DATES.length-1);i>=0;i--){let dt=DATES[i],sc=score(s.days[dt]||{}),ok=metric==="overall"?sc.perfect:sc[metric]===1;if(ok)cur++;else break}return{cur,best}}
function go(id){document.querySelectorAll(".screen").forEach(x=>x.classList.toggle("on",x.id===id));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.s===id));if(id==="calendar")renderCal();if(id==="stats")renderStats()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.s));
function renderHome(){let s=store(),d=s.days[today()]||{},sc=score(d),ad=arcDay(),elapsed=clamp(ad,0,90),perfect=DATES.filter(x=>score(s.days[x]||{}).perfect).length,pct=elapsed?Math.round(perfect/elapsed*100):0;$("daypill").textContent=ad<1?"Start 05.10.":ad>90?"Abgeschlossen ✨":"Tag "+ad+" / 90";$("pct").textContent=pct+"%";$("pbar").style.width=pct+"%";$("streak").textContent=streak("overall").cur+" 🔥";$("herotxt").textContent=perfect+" perfekte Tage · "+DATES.filter(x=>s.days[x]).length+" Tage dokumentiert";let list=[["wake","☀️","Früh aufstehen","06:30–07:30",d.wake||"noch offen"],["steps","👟","Schritte","mind. 5.000",d.steps?d.steps+" Schritte":"noch offen"],["study","📚","Lernen","Ziel 6 Stunden",d.study!==undefined&&d.study!==""?d.study+" h":"noch offen"],["move","🎀","Bewegung","mind. 30 Minuten",d.move?d.move+" Min. · "+(d.sport||""):"noch offen"],["read","📖","Lesen","Hauptsache überhaupt",d.pages?d.pages+" Seiten":"noch offen"],["doom","📵","No Doomscrolling","bewusst wenig scrollen",d.doom?({gut:"kaum / gar nicht",mittel:"etwas",viel:"viel"}[d.doom]):"noch offen"]];$("habits").innerHTML=list.map(h=>{let v=sc[h[0]],c=v===1?"good":v===.5?"part":"";return '<div class="habit '+c+'" onclick="go(\'check\')"><div class="ico">'+h[1]+'</div><div><b>'+h[2]+'</b><span>'+h[3]+' · '+h[4]+'</span></div><div class="mark">'+(v===1?"✓":v===.5?"~":"○")+'</div></div>'}).join("");$("hmood").textContent=d.mood?d.mood+"/5":"–";$("henergy").textContent=d.energy?d.energy+"/5":"–";$("hstress").textContent=d.stress?d.stress+"/5":"–"}
document.querySelectorAll(".moods").forEach(g=>{g.innerHTML=[1,2,3,4,5].map(n=>'<button data-v="'+n+'">'+["","😞","😕","😐","🙂","🥰"][n]+"</button>").join("");g.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.preventDefault();g.dataset.v=b.dataset.v;g.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))})});
function load(dt){let d=store().days[dt]||{};["wake","steps","study","move","sport","pages","doom","note"].forEach(id=>$(id).value=d[id]??"");$("sportnote").value=d.sportnote??"";document.querySelectorAll(".moods").forEach(g=>{g.dataset.v=d[g.dataset.f]??"";g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v==g.dataset.v))})}$("date").min=START;$("date").max=END;$("date").value=DATES.includes(today())?today():START;$("date").onchange=()=>load($("date").value);load($("date").value);
$("save").onclick=()=>{let s=store(),dt=$("date").value;s.days[dt]={wake:$("wake").value,steps:$("steps").value,study:$("study").value,move:$("move").value,sport:$("sport").value,sportnote:$("sportnote").value,pages:$("pages").value,doom:$("doom").value,note:$("note").value,mood:+document.querySelector('[data-f="mood"]').dataset.v||"",energy:+document.querySelector('[data-f="energy"]').dataset.v||"",stress:+document.querySelector('[data-f="stress"]').dataset.v||""};saveStore(s);renderHome();$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1400)};
function renderCal(){let s=store(),m=$("metric").value,c=$("cal");c.innerHTML=["Mo","Di","Mi","Do","Fr","Sa","So"].map(x=>'<div class="dow">'+x+"</div>").join("");let pad=(new Date(START+"T12:00:00").getDay()+6)%7;for(let i=0;i<pad;i++)c.innerHTML+="<div></div>";DATES.forEach(dt=>{let d=s.days[dt]||{},sc=score(d),v=m==="overall"?sc.overall:m==="mood"?(d.mood?d.mood/5:null):sc[m],cl=v===1||v>=.8?"good":v>0?"part":s.days[dt]?"bad":"";if(dt>today())cl+=" future";if(dt===today())cl+=" today";c.innerHTML+='<div class="day '+cl+'" data-d="'+dt+'">'+new Date(dt+"T12:00:00").getDate()+"</div>"});c.querySelectorAll("[data-d]").forEach(x=>x.onclick=()=>{$("date").value=x.dataset.d;load(x.dataset.d);go("check")})}$("metric").onchange=renderCal;
function renderStats(){let s=store(),perfect=DATES.filter(x=>score(s.days[x]||{}).perfect),study=DATES.reduce((a,x)=>a+(+(s.days[x]?.study||0)),0),sv=DATES.map(x=>+(s.days[x]?.steps||0)).filter(Boolean),pages=DATES.reduce((a,x)=>a+(+(s.days[x]?.pages||0)),0);$("statcards").innerHTML=[["Perfekte Tage",perfect.length],["Lernstunden",study.toFixed(1)],["Ø Schritte",sv.length?Math.round(sv.reduce((a,b)=>a+b,0)/sv.length):0],["Gelesene Seiten",pages]].map(x=>'<div class="stat"><div class="n">'+x[1]+'</div><div class="small muted">'+x[0]+"</div></div>").join("");let idx=Math.max(0,DATES.indexOf(today())),ws=Math.floor(idx/7)*7,wd=DATES.slice(ws,ws+7),gym=0,card=0,rests=0,moves=0;wd.forEach(x=>{let d=s.days[x]||{},sp=d.sport||"";if(sp.includes("Gym"))gym++;if(sp.includes("Laufen")||sp.includes("Cardio"))card++;if(sp.includes("Rest Day"))rests++;if(+d.move>=30)moves++});let wk="W"+(Math.floor(ws/7)+1),clean=!!s.clean[wk],items=[["Krafttraining",gym,4],["Cardio / Laufen",card,2],["30+ Min. Bewegung",moves,7],["Putzen / Aufräumen",clean?1:0,1]];$("weekstats").innerHTML=items.map(x=>'<div class="week"><div class="row"><span>'+x[0]+'</span><b>'+x[1]+"/"+x[2]+'</b></div><div class="bar"><span style="width:'+clamp(x[1]/x[2]*100,0,100)+'%"></span></div></div>').join("")+'<div class="small muted">Rest Days: '+rests+" · Ziel höchstens 2</div>";$("clean").textContent=clean?"Diese Woche erledigt ✓":"Putzen / Aufräumen erledigt";$("clean").onclick=()=>{let s=store();s.clean[wk]=!s.clean[wk];saveStore(s);renderStats()};let mp=perfect.map(x=>+(s.days[x].mood||0)).filter(Boolean),other=DATES.filter(x=>s.days[x]&&!score(s.days[x]).perfect).map(x=>+(s.days[x].mood||0)).filter(Boolean),avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):"–";$("moodstats").innerHTML='<div class="row"><span>Ø Stimmung an perfekten Tagen</span><b>'+avg(mp)+'/5</b></div><div class="row" style="margin-top:8px"><span>Ø Stimmung an übrigen Tagen</span><b>'+avg(other)+'/5</b></div><div class="small muted" style="margin-top:10px">Zeigt Zusammenhänge, keine sichere Ursache.</div>';let labels={overall:"Perfekte Tage",wake:"Früh aufstehen",steps:"Schritte",study:"Lernen",move:"Bewegung",read:"Lesen",doom:"No Doomscrolling"};$("streakstats").innerHTML=Object.keys(labels).map(k=>{let z=streak(k);return '<div class="row" style="margin:8px 0"><span>'+labels[k]+'</span><span><b>'+z.cur+'</b> aktuell · '+z.best+" Rekord</span></div>"}).join("")}renderHome();
</script></body></html>
